<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Editor - Aprende a Programar</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.css">

    <style>
        :root {
            --syntax-green: #50fa7b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: #2d2d2d;
            padding: 8px 16px;
            display: flex;
            gap: 16px;
            border-bottom: 1px solid #3c3c3c;
            align-items: center;
            min-height: 48px;
            flex-shrink: 0;
            flex-wrap: wrap;
            row-gap: 8px;
        }

        .toolbar-group { display: flex; gap: 8px; align-items: center; }

        .toolbar-button {
            background: #3c3c3c;
            border: none;
            color: #d4d4d4;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .toolbar-button:hover { background: #4a4a4a; }
        .toolbar-button.run { background: #0e639c; color: white; }
        .toolbar-button.run:hover { background: #1177bb; }

        .container {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .container.orientation-vertical { flex-direction: column; }

        .panel {
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            border-right: 1px solid #3c3c3c;
            overflow: hidden;
            min-width: 200px;
            min-height: 100px;
            height: 100%;
        }
        .panel.hidden { display: none; }

        .container.orientation-vertical > .panel,
        .container.orientation-vertical > .right-panels-container {
            height: auto;
            width: 100%;
            min-width: 0;
        }

        .panel-header {
            background: #2d2d2d;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3c3c3c;
            height: 40px;
            flex-shrink: 0;
            cursor: grab;
            user-select: none;
        }
        .panel-header:active { cursor: grabbing; }

        .panel-title {
            font-size: 12px;
            font-weight: 600;
            color: #ccc;
            text-transform: uppercase;
        }

        .panel-controls { display: flex; gap: 6px; align-items: center; pointer-events: auto; }
        .panel-controls button {
            background: #3c3c3c;
            border: none;
            color: #d4d4d4;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: 0.2s;
        }
        .panel-controls button:hover { background: #4a4a4a; }
        .panel-controls button.close-btn:hover { background: #c42b1c; }

        .font-size-controls { display: flex; gap: 2px; }
        .font-size-controls button { width: 22px; height: 22px; font-size: 12px; }

        .code-container { flex: 1; overflow: hidden; height: calc(100% - 40px); }

        .CodeMirror {
            height: 100%;
            font-family: 'Consolas', 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        /* ===== TEMA RUBY ===== */
        .cm-s-dracula.CodeMirror { color: #c792ea !important; }
        .cm-s-dracula .cm-string,
        .cm-s-dracula .cm-string-2 { color: #82aaff !important; }
        .cm-s-dracula .cm-variable-2,
        .cm-s-dracula .cm-meta,
        .cm-s-dracula .cm-bracket { color: #c792ea !important; }
        .cm-s-dracula .cm-builtin,
        .cm-s-dracula .cm-def,
        .cm-s-dracula .cm-attribute,
        .cm-s-dracula .cm-qualifier { color: var(--syntax-green) !important; }

        .CodeMirror-activeline-background { background: rgba(255, 255, 255, 0.03) !important; }

        .CodeMirror-foldgutter { width: 16px; }
        .CodeMirror-foldgutter-open,
        .CodeMirror-foldgutter-folded { cursor: pointer; color: #666; font-size: 12px; }
        .CodeMirror-foldgutter-open:after { content: "▾"; }
        .CodeMirror-foldgutter-folded:after { content: "▸"; }

        .output-content {
            padding: 16px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.6;
            height: 100%;
            overflow: auto;
            background: #1e1e1e;
            color: #d4d4d4;
            white-space: pre-wrap;
            word-wrap: break-word;
            position: relative;
        }

        .input-container {
            display: flex;
            align-items: center;
            margin: 4px 0;
            background: #2d2d2d;
            border: 1px solid #0e639c;
            border-radius: 4px;
            padding: 4px 8px;
        }
        .input-prompt { color: #0e639c; margin-right: 8px; font-weight: bold; }
        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: #d4d4d4;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            outline: none;
        }
        .input-submit {
            background: #0e639c;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }
        .input-submit:hover { background: #1177bb; }

        .resize-handle-vertical {
            width: 4px;
            background: #3c3c3c;
            cursor: col-resize;
            height: 100%;
            flex-shrink: 0;
        }
        .resize-handle-vertical:hover { background: #0e639c; }

        .container.orientation-vertical #handleVertical {
            width: 100%;
            height: 4px;
            cursor: row-resize;
        }

        .right-panels-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }
        .right-panels-container.orientation-horizontal { flex-direction: row; }
        .right-panels-container.orientation-horizontal > .panel {
            min-width: 0;
            min-height: 0;
            height: auto;
            width: 100%;
        }
        .right-panels-container:not(.orientation-horizontal) > .panel {
            min-width: 0;
            min-height: 0;
        }

        .resize-handle-interior {
            background: #3c3c3c;
            flex-shrink: 0;
        }
        .resize-handle-interior:hover { background: #0e639c; }
        .right-panels-container:not(.orientation-horizontal) > .resize-handle-interior {
            height: 4px;
            width: 100%;
            cursor: row-resize;
        }
        .right-panels-container.orientation-horizontal > .resize-handle-interior {
            width: 4px;
            height: 100%;
            cursor: col-resize;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }

        .switch { position: relative; display: inline-block; width: 36px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3c3c3c;
            transition: 0.3s;
            border-radius: 18px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 2px; bottom: 2px;
            background-color: #d4d4d4;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #0e639c; }
        input:checked + .slider:before { transform: translateX(18px); }
        .switch-label { font-size: 12px; color: #ccc; }

        .draggable-panel { position: relative; }
        .draggable-panel.drag-over {
            border: 2px solid #0e639c;
            background: rgba(14, 99, 156, 0.1);
        }

        .CodeMirror-gutter { border-right: 1px solid #3c3c3c; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-group">
            <button class="toolbar-button run" onclick="runCode()" title="Ejecutar código (Ctrl+Enter)">▶️ Run</button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-button" onclick="togglePanel('panel1')">📝 Editor</button>
            <button class="toolbar-button" onclick="togglePanel('panel3')">▶️ Console</button>
            <button class="toolbar-button" onclick="togglePanel('panel4')">📔 Notes</button>
        </div>
        <div class="switch-container">
            <label class="switch">
                <input type="checkbox" id="autoRunSwitch" onchange="toggleAutoRun()">
                <span class="slider"></span>
            </label>
            <span class="switch-label">Auto-run</span>
        </div>
        <!-- Único toggle de orientación: todas las ventanas horizontales -->
        <div class="switch-container">
            <button class="toolbar-button" id="allHorizontalBtn" onclick="toggleAllHorizontal()"
                    title="Poner todas las ventanas en horizontal (o volver a la disposición original)">
                ⇅ Todas vertical
            </button>
        </div>
    </div>

    <div class="container" id="app">
        <div class="panel draggable-panel" id="panel1" style="flex: 1;" data-panel-id="panel1">
            <div class="panel-header" draggable="true" data-panel-id="panel1">
                <span class="panel-title">Python Editor</span>
                <div class="panel-controls">
                    <div class="font-size-controls">
                        <button onclick="changeFontSize('panel1', -1)">−</button>
                        <button onclick="changeFontSize('panel1', 1)">+</button>
                    </div>
                    <button class="close-btn" onclick="togglePanel('panel1')">✕</button>
                </div>
            </div>
            <div class="code-container">
                <textarea id="editor-main"></textarea>
            </div>
        </div>

        <div class="resize-handle-vertical" id="handleVertical" onmousedown="initResizeVertical(event)"></div>

        <div class="right-panels-container" id="rightPanelContainer">
            <div class="panel draggable-panel" id="panel3" style="flex: 1;" data-panel-id="panel3">
                <div class="panel-header" draggable="true" data-panel-id="panel3">
                    <span class="panel-title">Console Output</span>
                    <div class="panel-controls">
                        <div class="font-size-controls">
                            <button onclick="changeFontSize('panel3', -1)">−</button>
                            <button onclick="changeFontSize('panel3', 1)">+</button>
                        </div>
                        <button class="close-btn" onclick="togglePanel('panel3')">✕</button>
                    </div>
                </div>
                <div class="code-container">
                    <div class="output-content" id="outputContent">
                        > Ready to execute...
                    </div>
                </div>
            </div>

            <div class="resize-handle-interior" id="handleInterior"></div>

            <div class="panel draggable-panel" id="panel4" style="flex: 1;" data-panel-id="panel4">
                <div class="panel-header" draggable="true" data-panel-id="panel4">
                    <span class="panel-title">Notepad</span>
                    <div class="panel-controls">
                        <div class="font-size-controls">
                            <button onclick="changeFontSize('panel4', -1)">−</button>
                            <button onclick="changeFontSize('panel4', 1)">+</button>
                        </div>
                        <button class="close-btn" onclick="togglePanel('panel4')">✕</button>
                    </div>
                </div>
                <div class="code-container">
                    <textarea id="editor-notes"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/indent-fold.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/selection/active-line.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.min.js"></script>

    <script>
        // ============================================
        // ESTADO
        // ============================================
        let autoRunEnabled = false;
        let autoRunTimeout = null;
        let isWaitingForInput = false;
        let draggedPanel = null;
        let dragOverPanel = null;

        // Estado del único toggle: todas las ventanas en columna o no
        let allHorizontal = false; // false = layout original (editor izq, consola/notes apiladas der)
                                   // true  = todas apiladas en columna

        // ============================================================
        // MODO PYTHON POR LÍNEA
        // ============================================================
        CodeMirror.defineMode("python-linebased", function() {
            var keywords = /^(?:False|None|True|and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield)$/;
            var builtins = /^(?:print|len|range|str|int|float|bool|list|dict|tuple|set|type|isinstance|super|open|input|abs|sum|min|max|sorted|enumerate|zip|map|filter|self|reversed|repr|hash|id|dir|vars|format|iter|next|chr|ord|hex|bin|oct|round|pow|divmod|all|any|object|Exception|ValueError|TypeError|KeyError|IndexError|ZeroDivisionError|AttributeError)$/;

            function readString(stream) {
                var quote = stream.peek();
                if (quote !== '"' && quote !== "'") return null;
                if (stream.match(quote + quote + quote, false)) {
                    stream.next(); stream.next(); stream.next();
                    while (!stream.eol()) {
                        if (stream.match(quote + quote + quote, false)) {
                            stream.next(); stream.next(); stream.next();
                            break;
                        }
                        stream.next();
                    }
                } else {
                    stream.next();
                    var escaped = false;
                    while (!stream.eol()) {
                        var c = stream.next();
                        if (escaped) { escaped = false; continue; }
                        if (c === '\\') { escaped = true; continue; }
                        if (c === quote) break;
                    }
                }
                return "string";
            }

            return {
                startState: function() { return {}; },
                token: function(stream) {
                    if (stream.eatSpace()) return null;
                    var ch = stream.peek();
                    if (ch === '#') { stream.skipToEnd(); return "comment"; }
                    if (ch === '"' || ch === "'") return readString(stream);
                    if (/[a-zA-Z_]/.test(ch)) {
                        var nextChar = stream.string.charAt(stream.pos + 1);
                        if (nextChar === '"' || nextChar === "'") {
                            var p = ch.toLowerCase();
                            if (p === 'f' || p === 'r' || p === 'b' || p === 'u') {
                                stream.next();
                                return readString(stream);
                            }
                        }
                    }
                    if (/\d/.test(ch) || (ch === '.' && /\d/.test(stream.string.charAt(stream.pos + 1)))) {
                        stream.match(/^(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?[jJ]?/);
                        return "number";
                    }
                    if (/[a-zA-Z_]/.test(ch)) {
                        stream.match(/^[a-zA-Z_]\w*/);
                        var word = stream.current();
                        if (keywords.test(word)) return "keyword";
                        if (builtins.test(word)) return "builtin";
                        return "variable";
                    }
                    if (/[+\-*\/%=<>!&|^~]/.test(ch)) { stream.next(); return "operator"; }
                    if (/[()\[\]{}]/.test(ch)) { stream.next(); return "bracket"; }
                    stream.next();
                    return null;
                },
                indent: function(state, textAfter, line) {
                    var m = line.match(/^[ \t]*/);
                    var currentIndent = m ? m[0].length : 0;
                    if (/:[\s]*$/.test(line)) return currentIndent + 4;
                    return currentIndent;
                },
                lineComment: "#"
            };
        });

        // ============================================
        // TOGGLE ÚNICO: TODAS LAS VENTANAS EN COLUMNA
        // ============================================
        function toggleAllHorizontal() {
            allHorizontal = !allHorizontal;

            const appContainer = document.getElementById('app');
            const rightContainer = document.getElementById('rightPanelContainer');
            const btn = document.getElementById('allHorizontalBtn');
            const panel1 = document.getElementById('panel1');

            if (allHorizontal) {
                // Todas las ventanas apiladas en columna
                appContainer.classList.add('orientation-vertical');
                rightContainer.classList.add('orientation-horizontal');
                btn.textContent = '⇄ Todas horizontal';
                btn.title = 'Volver a la disposición original (editor izquierda)';
            } else {
                // Disposición original: editor izquierda, consola/notas apiladas derecha
                appContainer.classList.remove('orientation-vertical');
                rightContainer.classList.remove('orientation-horizontal');
                btn.textContent = '⇅ Todas vertical';
                btn.title = 'Poner todas las ventanas en horizontal';
            }

            panel1.style.flex = '1';
            rightContainer.style.flex = '1';
            rightContainer.querySelectorAll('.draggable-panel:not(.hidden)').forEach(function(p) {
                p.style.flex = '1';
            });

            setTimeout(function() { editorMain.refresh(); editorNotes.refresh(); }, 50);
            wireInteriorHandle();
        }

        // ============================================
        // DRAG & DROP
        // ============================================
        function initDragAndDrop() {
            const panelHeaders = document.querySelectorAll('.panel-header[draggable="true"]');
            const panels = document.querySelectorAll('.draggable-panel');
            const rightContainer = document.getElementById('rightPanelContainer');

            panelHeaders.forEach(function(h) {
                h.addEventListener('dragstart', handleDragStart);
                h.addEventListener('dragend', handleDragEnd);
            });
            panels.forEach(function(p) {
                p.addEventListener('dragover', handleDragOver);
                p.addEventListener('dragleave', handleDragLeave);
                p.addEventListener('drop', handleDrop);
            });
            rightContainer.addEventListener('dragover', handleDragOverContainer);
            rightContainer.addEventListener('dragleave', handleDragLeaveContainer);
            rightContainer.addEventListener('drop', handleDropContainer);

            function handleDragStart(e) {
                draggedPanel = e.target.closest('.draggable-panel');
                if (draggedPanel) {
                    draggedPanel.style.opacity = '0.5';
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', draggedPanel.id);
                }
            }
            function handleDragEnd() {
                if (draggedPanel) draggedPanel.style.opacity = '1';
                document.querySelectorAll('.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
                draggedPanel = null;
                setTimeout(function() { editorMain.refresh(); editorNotes.refresh(); }, 100);
            }
            function handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const t = e.target.closest('.draggable-panel');
                if (t && t !== draggedPanel && !t.classList.contains('hidden')) {
                    if (dragOverPanel !== t) {
                        if (dragOverPanel) dragOverPanel.classList.remove('drag-over');
                        dragOverPanel = t;
                        t.classList.add('drag-over');
                    }
                }
            }
            function handleDragLeave(e) {
                const t = e.target.closest('.draggable-panel');
                if (t && t === dragOverPanel) { t.classList.remove('drag-over'); dragOverPanel = null; }
            }
            function handleDrop(e) {
                e.preventDefault();
                const t = e.target.closest('.draggable-panel');
                if (t && t !== draggedPanel && draggedPanel) swapPanels(draggedPanel, t);
                if (dragOverPanel) { dragOverPanel.classList.remove('drag-over'); dragOverPanel = null; }
            }
            function handleDragOverContainer(e) {
                e.preventDefault(); e.dataTransfer.dropEffect = 'move';
                if (draggedPanel && draggedPanel.id === 'panel1') rightContainer.classList.add('drag-over');
            }
            function handleDragLeaveContainer() { rightContainer.classList.remove('drag-over'); }
            function handleDropContainer(e) {
                e.preventDefault(); rightContainer.classList.remove('drag-over');
                if (draggedPanel && draggedPanel.id === 'panel1') movePanelToContainer(draggedPanel, rightContainer);
            }
        }

        function swapPanels(p1, p2) {
            const parent1 = p1.parentElement, parent2 = p2.parentElement;
            if (parent1 === parent2) {
                const children = Array.from(parent1.children);
                const i1 = children.indexOf(p1), i2 = children.indexOf(p2);
                if (i1 < i2) {
                    parent1.insertBefore(p2, p1);
                    parent1.insertBefore(p1, p2.nextSibling);
                } else {
                    parent1.insertBefore(p1, p2);
                    parent1.insertBefore(p2, p1.nextSibling);
                }
            }
            setTimeout(function() { editorMain.refresh(); editorNotes.refresh(); }, 100);
        }

        function movePanelToContainer(panel, container) {
            panel.remove();
            container.insertBefore(panel, container.firstChild);
            panel.style.flex = '1';
            setTimeout(function() { editorMain.refresh(); editorNotes.refresh(); }, 100);
        }

        // ============================================
        // INPUT
        // ============================================
        function requestUserInput(prompt) {
            return new Promise(function(resolve) {
                const outputDiv = document.getElementById('outputContent');
                const inputContainer = document.createElement('div');
                inputContainer.className = 'input-container';

                const promptSpan = document.createElement('span');
                promptSpan.className = 'input-prompt';
                promptSpan.textContent = prompt || '> ';

                const inputField = document.createElement('input');
                inputField.type = 'text';
                inputField.className = 'input-field';
                inputField.autofocus = true;

                const submitButton = document.createElement('button');
                submitButton.className = 'input-submit';
                submitButton.textContent = 'Enter';

                inputContainer.appendChild(promptSpan);
                inputContainer.appendChild(inputField);
                inputContainer.appendChild(submitButton);
                outputDiv.appendChild(inputContainer);
                outputDiv.scrollTop = outputDiv.scrollHeight;

                function processInput() {
                    const value = inputField.value;
                    inputContainer.remove();
                    const inputEcho = document.createElement('span');
                    inputEcho.style.color = '#4ec9b0';
                    inputEcho.textContent = prompt + value + '\n';
                    outputDiv.appendChild(inputEcho);
                    outputDiv.scrollTop = outputDiv.scrollHeight;
                    isWaitingForInput = false;
                    resolve(value);
                }

                submitButton.addEventListener('click', processInput);
                inputField.addEventListener('keypress', function(e) { if (e.key === 'Enter') processInput(); });
                isWaitingForInput = true;
            });
        }

        // ============================================
        // EDITORES
        // ============================================
        const editorMain = CodeMirror.fromTextArea(document.getElementById('editor-main'), {
            lineNumbers: true,
            mode: 'python-linebased',
            theme: 'dracula',
            lineWrapping: true,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            autoCloseBrackets: false,
            matchBrackets: true,
            foldGutter: true,
            gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
            styleActiveLine: true,
            value: `# Python Editor - ¡Aprende a programar!
# Escribe tu código aquí y presiona Run para ejecutar.

class Animal:
    def __init__(self, nombre, edad):
        self.nombre = nombre
        self.edad = edad
    
    def hablar(self):
        return f"{self.nombre} hace un sonido"

        // ============================================
        // EJECUCIÓN
        // ============================================
        async function runCode() {
            if (isWaitingForInput) return;

            const code = editorMain.getValue().trim();
            const outputDiv = document.getElementById('outputContent');

            if (!code) { outputDiv.textContent = '> Listo para ejecutar...'; return; }

            outputDiv.innerHTML = '> Ejecutando...\n';

            const originalConsoleLog = console.log;
            const originalConsoleError = console.error;
            const originalConsoleWarn = console.warn;

            console.log = function() {
                var args = Array.prototype.slice.call(arguments);
                const text = args.map(function(a) { return typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a); }).join(' ');
                const span = document.createElement('span');
                span.textContent = text + '\n';
                outputDiv.appendChild(span);
                outputDiv.scrollTop = outputDiv.scrollHeight;
            };
            console.error = function() {
                var args = Array.prototype.slice.call(arguments);
                const text = args.map(function(a) { return typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a); }).join(' ');
                const span = document.createElement('span');
                span.style.color = '#f44747';
                span.textContent = '⛔ Error: ' + text + '\n';
                outputDiv.appendChild(span);
                outputDiv.scrollTop = outputDiv.scrollHeight;
            };
            console.warn = function() {
                var args = Array.prototype.slice.call(arguments);
                const text = args.map(function(a) { return typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a); }).join(' ');
                const span = document.createElement('span');
                span.style.color = '#cca700';
                span.textContent = '⚠️ Warning: ' + text + '\n';
                outputDiv.appendChild(span);
                outputDiv.scrollTop = outputDiv.scrollHeight;
            };

            function outf(text) {
                const span = document.createElement('span');
                span.textContent = text;
                outputDiv.appendChild(span);
                outputDiv.scrollTop = outputDiv.scrollHeight;
            }

            function builtinRead(x) {
                if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
                    throw "Archivo no encontrado: '" + x + "'";
                return Sk.builtinFiles["files"][x];
            }

            const originalPrompt = window.prompt;
            window.prompt = function() { return null; };

            Sk.configure({
                output: outf,
                read: builtinRead,
                __future__: Sk.python3,
                inputfun: function(prompt) { return requestUserInput(prompt || ''); },
                inputfunTakesPrompt: true
            });

            try {
                await Sk.misceval.asyncToPromise(function() {
                    return Sk.importMainWithBody("<stdin>", false, code, true);
                });
                console.log = originalConsoleLog;
                console.error = originalConsoleError;
                console.warn = originalConsoleWarn;
                window.prompt = originalPrompt;
            } catch (err) {
                const span = document.createElement('span');
                span.style.color = '#f44747';
                span.textContent = '\n⛔ Error: ' + err.toString() + '\n';
                outputDiv.appendChild(span);
                outputDiv.scrollTop = outputDiv.scrollHeight;
                console.log = originalConsoleLog;
                console.error = originalConsoleError;
                console.warn = originalConsoleWarn;
                window.prompt = originalPrompt;
            }
        }

        // ============================================
        // AUTO-RUN
        // ============================================
        function toggleAutoRun() {
            autoRunEnabled = document.getElementById('autoRunSwitch').checked;
            if (autoRunEnabled) {
                editorMain.on('change', function() {
                    if (!isWaitingForInput) {
                        clearTimeout(autoRunTimeout);
                        autoRunTimeout = setTimeout(function() { runCode(); }, 1000);
                    }
                });
            } else {
                editorMain.off('change');
                clearTimeout(autoRunTimeout);
            }
        }

        editorMain.setOption("extraKeys", {
            "Ctrl-Enter": runCode,
            "Tab": function(cm) {
                if (cm.somethingSelected()) cm.indentSelection("add");
                else cm.replaceSelection(cm.getOption("indentWithTabs") ? "\t" :
                    Array(cm.getOption("indentUnit") + 1).join(" "), "end", "+input");
            },
            "Shift-Tab": function(cm) {
                if (cm.somethingSelected()) cm.indentSelection("subtract");
            }
        });

        editorNotes.setOption("extraKeys", {
            "Tab": function(cm) {
                if (cm.somethingSelected()) cm.indentSelection("add");
                else cm.replaceSelection(cm.getOption("indentWithTabs") ? "\t" :
                    Array(cm.getOption("indentUnit") + 1).join(" "), "end", "+input");
            },
            "Shift-Tab": function(cm) {
                if (cm.somethingSelected()) cm.indentSelection("subtract");
            }
        });

        // ============================================
        // FUENTES
        // ============================================
        function changeFontSize(panelId, delta) {
            if (panelId === 'panel1') {
                const cm = document.querySelector('#panel1 .CodeMirror');
                if (cm) {
                    const s = parseInt(window.getComputedStyle(cm).fontSize) + delta;
                    if (s >= 10 && s <= 30) { cm.style.fontSize = s + 'px'; editorMain.refresh(); }
                }
            } else if (panelId === 'panel3') {
                const out = document.getElementById('outputContent');
                const s = parseInt(window.getComputedStyle(out).fontSize) + delta;
                if (s >= 10 && s <= 30) out.style.fontSize = s + 'px';
            } else if (panelId === 'panel4') {
                const cm = document.querySelector('#panel4 .CodeMirror');
                if (cm) {
                    const s = parseInt(window.getComputedStyle(cm).fontSize) + delta;
                    if (s >= 10 && s <= 30) { cm.style.fontSize = s + 'px'; editorNotes.refresh(); }
                }
            }
        }

        // ============================================
        // RESIZE
        // ============================================
        let isResizing = false;
        let currentResizeType = null;
        let startX, startY;
        let startPanel1Dim, startRightDim;
        let startTopHeight, startBottomHeight;
        let startLeftInteriorWidth, startRightInteriorWidth;

        const panel1 = document.getElementById('panel1');
        const rightContainer = document.getElementById('rightPanelContainer');

        function togglePanel(panelId) {
            document.getElementById(panelId).classList.toggle('hidden');
            const hv = document.getElementById('handleVertical');
            hv.style.display = panel1.classList.contains('hidden') ? 'none' : 'block';
            setTimeout(function() { editorMain.refresh(); editorNotes.refresh(); }, 10);
            wireInteriorHandle();
        }

        function initResizeVertical(e) {
            isResizing = true;
            currentResizeType = 'outer';
            startX = e.clientX;
            startY = e.clientY;
            // Si el layout principal está en vertical, redimensionamos en Y; si no, en X
            const isVerticalLayout = document.getElementById('app').classList.contains('orientation-vertical');
            if (!isVerticalLayout) {
                startPanel1Dim = panel1.offsetWidth;
                startRightDim = rightContainer.offsetWidth;
            } else {
                startPanel1Dim = panel1.offsetHeight;
                startRightDim = rightContainer.offsetHeight;
            }
            document.addEventListener('mousemove', resizeOuter);
            document.addEventListener('mouseup', stopResize);
            e.preventDefault();
        }

        function resizeOuter(e) {
            if (!isResizing || currentResizeType !== 'outer') return;
            const isVerticalLayout = document.getElementById('app').classList.contains('orientation-vertical');
            const total = startPanel1Dim + startRightDim;
            let newDim;
            if (!isVerticalLayout) {
                const dx = e.clientX - startX;
                newDim = ((startPanel1Dim + dx) / total) * 100;
            } else {
                const dy = e.clientY - startY;
                newDim = ((startPanel1Dim + dy) / total) * 100;
            }
            if (newDim > 20 && newDim < 80) {
                panel1.style.flex = newDim;
                rightContainer.style.flex = 100 - newDim;
                editorMain.refresh();
                editorNotes.refresh();
            }
        }

        function initResizeInteriorVertical(e) {
            isResizing = true;
            currentResizeType = 'interior-vertical';
            startY = e.clientY;
            startTopHeight = document.getElementById('panel3').offsetHeight;
            startBottomHeight = document.getElementById('panel4').offsetHeight;
            document.addEventListener('mousemove', resizeInteriorVertical);
            document.addEventListener('mouseup', stopResize);
            e.preventDefault();
        }

        function resizeInteriorVertical(e) {
            if (!isResizing || currentResizeType !== 'interior-vertical') return;
            const dy = e.clientY - startY;
            const total = startTopHeight + startBottomHeight;
            let newTop = ((startTopHeight + dy) / total) * 100;
            if (newTop > 15 && newTop < 85) {
                document.getElementById('panel3').style.flex = newTop;
                document.getElementById('panel4').style.flex = 100 - newTop;
                editorMain.refresh();
                editorNotes.refresh();
            }
        }

        function initResizeInteriorHorizontal(e) {
            isResizing = true;
            currentResizeType = 'interior-horizontal';
            startX = e.clientX;
            startLeftInteriorWidth = document.getElementById('panel3').offsetWidth;
            startRightInteriorWidth = document.getElementById('panel4').offsetWidth;
            document.addEventListener('mousemove', resizeInteriorHorizontal);
            document.addEventListener('mouseup', stopResize);
            e.preventDefault();
        }

        function resizeInteriorHorizontal(e) {
            if (!isResizing || currentResizeType !== 'interior-horizontal') return;
            const dx = e.clientX - startX;
            const total = startLeftInteriorWidth + startRightInteriorWidth;
            let newLeft = ((startLeftInteriorWidth + dx) / total) * 100;
            if (newLeft > 15 && newLeft < 85) {
                document.getElementById('panel3').style.flex = newLeft;
                document.getElementById('panel4').style.flex = 100 - newLeft;
                editorMain.refresh();
                editorNotes.refresh();
            }
        }

        function stopResize() {
            isResizing = false;
            currentResizeType = null;
            document.removeEventListener('mousemove', resizeOuter);
            document.removeEventListener('mousemove', resizeInteriorVertical);
            document.removeEventListener('mousemove', resizeInteriorHorizontal);
            document.removeEventListener('mouseup', stopResize);
            editorMain.refresh();
            editorNotes.refresh();
        }

        // El handle interior es siempre vertical (row-resize) porque Console y Notes
        // están SIEMPRE apiladas. Cuando todas están en horizontal, no hay handle interior.
        function wireInteriorHandle() {
            const handle = document.getElementById('handleInterior');
            const newHandle = handle.cloneNode(false);
            handle.parentNode.replaceChild(newHandle, handle);
            newHandle.addEventListener('mousedown', function(e) {
                initResizeInteriorVertical(e);
            });
            // El handle interior solo aplica cuando el layout NO es todo horizontal
            const bothVisible =
                !document.getElementById('panel3').classList.contains('hidden') &&
                !document.getElementById('panel4').classList.contains('hidden') &&
                !allHorizontal;
            newHandle.style.display = bothVisible ? '' : 'none';
        }

        window.addEventListener('resize', function() { editorMain.refresh(); editorNotes.refresh(); });

        document.addEventListener('DOMContentLoaded', function() {
            initDragAndDrop();
            wireInteriorHandle();
        });

        // Exponer al global
        window.initResizeVertical = initResizeVertical;
        window.changeFontSize = changeFontSize;
        window.runCode = runCode;
        window.toggleAutoRun = toggleAutoRun;
        window.toggleAllHorizontal = toggleAllHorizontal;
        window.togglePanel = togglePanel;
    </script>
